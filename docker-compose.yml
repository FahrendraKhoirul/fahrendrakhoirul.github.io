services:
  fahrendra-khoirul:
    build:
      context: .
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    networks:
      - web

networks:
  web:
    external: true

volumes:
  caddy_data:
  caddy_config: